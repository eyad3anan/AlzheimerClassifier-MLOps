stages:
  prepare:
    cmd: python -m src.prepare
    deps:
      - src/prepare.py
    params:
      - data
    outs:
      - splits
  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/model.py
      - splits
    params:
      - train.epochs
      - train.batch_size
      - train.learning_rate
      - train.dropout
      - train.dense_units
      - train.patience
      - train.weights
    outs:
      - models/model.weights.h5
      - reports/history.json:
          cache: false
  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/model.py
      - models/model.weights.h5
      - splits/test.csv
    metrics:
      - metrics.json:
          cache: false
    outs:
      - reports/confusion_matrix.json:
          cache: false
