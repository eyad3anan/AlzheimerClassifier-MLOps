[project]
name = "alzheimerclassifiertl-resnet50-transfer-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eyad3anan", email = "eyad.ananabed@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.28.0",
    "streamlit>=1.40",
    "tensorflow>=2.16",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
train = ["dvc>=3.50", "mlflow>=2.16", "scikit-learn>=1.5", "pandas>=2.2", "kaggle>=1.6"]

[tool.uv]
default-groups = ["dev", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
extend-exclude = ["*.ipynb"]
